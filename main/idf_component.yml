## ESP-IDF 组件依赖声明（main 组件）
##
## 2026-07-03 R002: 用 idf component 替换 components/u8g2 手动源码。
##   之前 components/u8g2/ 是手 clone 的 334M 第三方源码。
## 2026-07-03 R003: 暂禁用 u8g2 依赖（README 写的 lf_engineering/u8g2_esp32 在 registry 不存在）。
##   等用户提供正确 component 名后用 R004 启用真实 u8g2。
## 2026-07-29：u8g2 由 components/u8g2 手动源码提供；u8g2_esp32_hal 组件已移除（display.cpp 使用自写 SPI 驱动，不依赖该 HAL）。
##   本 yml 作占位；若未来启用 idf component 版 u8g2，需先评估版本与手动源码的兼容性。
##
## 2026-07-29：WS2812 状态指示灯改用 ESP-IDF Component Manager 的 led_strip 组件
##   （ESP-IDF v5.5 起 led_strip 已移出内置组件，需经 idf component manager 拉取）。
##
## 2026-08-24 R076-CODEC: 验证官方推荐方案
##   - 按 D:\esp-adf-release-v2.x\examples\player\pipeline_sdcard_mp3_control 模板重构 audio_player.cpp
##   - 新增 rsp_filter 重采样元素（decoder->filter->i2s）
##   - i2s 时钟统一 48000Hz（MAX98357A 支持 8k-96kHz）
##   - 切歌流程改用 reset_ringbuffer 模式（避免 terminate+重建 task 重复触发 mp3_decoder_open）
##   - MP3 decoder 恢复默认配置（不加 task_stack=8K / stack_in_ext=false 自定义参数）
##   - 本 yml 不变（不需要额外依赖：rsp_filter / filter_resample.h 来自 ADF 自带 esp_codec）
##
## 2026-08-24 R076-CODEC-11: 添加 esp_audio_codec 依赖（idf component manager 形式）
##   - esp_audio_codec 是 ADF 的子组件，提供 esp_mp3_dec_* / esp_audio_simple_dec_* API
##   - 其 .c 源（含 simple_decoder_reg.c 编译 esp_audio_simple_dec_register_default 实现）
##     会通过 component manager 自动编入固件并链接进 main
##   - 之前手工 link libesp_audio_codec.a + libesp_audio_simple_dec.a 是 prebuilt 库，
##     但注册函数实现不在 prebuilt 里而是在 esp_audio_codec 组件源码里，所以需显式
##     通过 idf component manager 拉该组件
##
## 2026-08-25 R076-CODEC-13: 删掉 espressif/esp_audio_codec 依赖
##   - 切到 ESP-ADF release/v2.x 稳定分支 (eac70fd)，其 esp-adf-libs submodule
##     锁定 3472016c (master HEAD 2026-08-06，已含 esp_audio v1.8.2 升级)
##   - 不再依赖 component manager 拉的 espressif/esp_audio_codec v2.6.2 (与 ADF 内置
##     路径不一致，怀疑这是双链路冲突 / es_parser v1.0.1 新 bug 的来源)
##   - 完全用 ADF 内部 prebuilt .a + ADF 内部 src/*.c，确保版本一致性
##   - wrapper (mp3_decoder_esp_codec.c) 继续用 esp_audio_simple_dec_* API，
##     但 .so/.a 全部来自 ADF 内置路径
##
## 2026-08-25 R076-CODEC-17: 重新添加 espressif/esp_audio_codec v2.6.2 (component manager)
##   - 用户决策 (2026-08-25): '用最新稳定版, 不再混搭'
##   - 赌 v2.6.2 的 parser 比 ADF 内置 v2.4.1 在 ID3v2 / 异常 VBR 上更稳
##   - 唯一单路径: 完全依赖 component manager 拉的 v2.6.2,
##     不再手工 link ADF 内置的 libesp_audio_codec.a / libesp_audio_simple_dec.a
##   - 需要在 main/CMakeLists.txt 里手动排除 ADF 内部 esp_audio_codec 链接,
##     避免双链路符号冲突
##   - wrapper 改回 esp_audio_simple_dec_open/process 路径 (R076-CODEC-10)

version: 1.0.0
description: audiobook_player main firmware component

dependencies:
  espressif/led_strip:
    version: ^3.0.0
  lvgl/lvgl:
    version: '>=9.0.0'
  espressif/freetype: '*'
  espressif/esp_audio_codec:
    version: '*'
  chmorgan/esp-libhelix-mp3:
    version: ^1.0.3